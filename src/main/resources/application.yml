spring:
  application:
    name: bibliotech
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bibliotech}
    username: ${DB_USER:bibliotech}
    password: ${DB_PASSWORD:bibliotech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cache:
    cache-names: books
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30s,recordStats

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.bibliotech: DEBUG

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

app:
  security:
    jwt:
      issuer: bibliotech
      expiration: 1h
      secret: ${JWT_SECRET:dev-only-secret-never-use-in-prod-0123456789abcdef}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@bibliotech.local}
      password: ${ADMIN_PASSWORD:admin12345}

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    cache-names: books
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30s,recordStats

logging:
  level:
    com.bibliotech: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}